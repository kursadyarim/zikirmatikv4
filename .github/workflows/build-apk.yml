name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini olustur
        run: |
          set -e
          HTML=$(ls zikirmatik_v*.html | sort -V | tail -n1)
          echo "Kullanilan dosya: $HTML"
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/java/com/zikirmatik/app
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/mipmap-anydpi-v26
          mkdir -p proj/app/src/main/res/drawable
          cp "$HTML" proj/app/src/main/assets/index.html

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Zikirmatik'
          include ':app'
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zikirmatik.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.zikirmatik.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/java/com/zikirmatik/app/MainActivity.java <<'EOF'
          package com.zikirmatik.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.parseColor("#061A19"));
                  getWindow().setNavigationBarColor(Color.parseColor("#04120F"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#061A19"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setSupportZoom(false);

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "ZikirNative");
                  web.loadUrl("file:///android_asset/index.html");
              }

              private class Bridge {
                  @JavascriptInterface
                  public void vibrate(String json) {
                      try {
                          JSONArray a = new JSONArray(json);
                          long[] p = new long[a.length() + 1];
                          p[0] = 0;
                          for (int i = 0; i < a.length(); i++) {
                              p[i + 1] = a.getLong(i);
                          }
                          Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                          if (v == null || !v.hasVibrator()) return;
                          v.vibrate(VibrationEffect.createWaveform(p, -1));
                      } catch (Exception ignored) {
                      }
                  }

                  @JavascriptInterface
                  public void keepAwake(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (on) {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zikirmatik</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F3D38</color>
          </resources>
          EOF

          cat > proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > proj/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0E3F39"
                  android:strokeColor="#E9C46A"
                  android:strokeWidth="1.6"
                  android:pathData="M40,54a14,14 0 1,0 28,0a14,14 0 1,0 -28,0z" />
              <path
                  android:fillColor="#F6EFD6"
                  android:pathData="M59.75,30.51a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM67.27,34.85a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM72.85,41.50a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM75.82,49.66a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM75.82,58.34a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM67.27,73.15a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM59.75,77.49a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM51.20,79.00a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM42.65,77.49a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM35.13,73.15a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM26.58,58.34a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM26.58,49.66a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM29.55,41.50a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM35.13,34.85a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0zM42.65,30.51a2.8,2.8 0 1,0 5.60,0a2.8,2.8 0 1,0 -5.60,0z" />
              <path
                  android:fillColor="#E9C46A"
                  android:pathData="M49.60,29.00a4.4,4.4 0 1,0 8.80,0a4.4,4.4 0 1,0 -8.80,0zM71.25,66.50a4.4,4.4 0 1,0 8.80,0a4.4,4.4 0 1,0 -8.80,0zM27.95,66.50a4.4,4.4 0 1,0 8.80,0a4.4,4.4 0 1,0 -8.80,0z" />
          </vector>
          EOF

          echo "--- olusturulan dosyalar"
          find proj -type f | sort

      - name: APK derle
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: APK dosyasini hazirla
        run: |
          mkdir -p cikti
          cp proj/app/build/outputs/apk/debug/app-debug.apk cikti/Zikirmatik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zikirmatik-APK
          path: cikti/Zikirmatik.apk
