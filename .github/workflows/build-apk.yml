          cat > proj/app/src/main/java/com/zikirmatik/app/MainActivity.java <<'EOF'
          package com.zikirmatik.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.parseColor("#061A19"));
                  getWindow().setNavigationBarColor(Color.parseColor("#04120F"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#061A19"));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setSupportZoom(false);

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "ZikirNative");
                  web.loadUrl("file:///android_asset/index.html");
              }

              private class Bridge {
                  @JavascriptInterface
                  public void vibrate(String json) {
                      try {
                          JSONArray a = new JSONArray(json);
                          long[] p = new long[a.length() + 1];
                          p[0] = 0;
                          for (int i = 0; i < a.length(); i++) {
                              p[i + 1] = a.getLong(i);
                          }
                          Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                          if (v == null || !v.hasVibrator()) return;
                          v.vibrate(VibrationEffect.createWaveform(p, -1));
                      } catch (Exception ignored) {
                      }
                  }

                  @JavascriptInterface
                  public void keepAwake(final boolean on) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (on) {
                                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              } else {
                                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.zikirBack ? window.zikirBack() : false)", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (!"true".equals(value)) {
                              finish();
                          }
                      }
                  });
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          EOF

